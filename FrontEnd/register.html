<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Criar conta — Investify</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <link rel="stylesheet" href="assets/css/auth.css"/>
</head>
<body>
  <div class="login-container">
    <div class="login-sidebar">
      <div class="logo">Investify</div>
      <div class="divider"></div>
      <p class="sidebar-tagline">Organize seu portifolio de maneira inteligente.</p>
    </div>

    <div class="login-main">
      <div class="login-card">
        <h1>Criar <span>conta</span></h1>
        <p>Comece a acompanhar seus investimentos hoje</p>

        <div id="erro" class="erro" style="display:none"></div>

        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome"/>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email"/>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password"/>
        </div>

        <div class="form-group">
          <label for="confirm">Confirmar senha</label>
          <input type="password" id="confirm"/>
        </div>

        <button class="btn-login" onclick="register()">Criar conta</button>

        <p class="signup-text">
          Já tem conta? <a href="login.html">Entrar</a>
        </p>
      </div>
    </div>
  </div>

  <!-- =========================================================
       CARD DE SUCESSO (substitui o alert)
  ========================================================== -->
  <div id="modal-sucesso" class="modal" style="display:none;">
    <div class="modal-content">

      <button type="button" class="modal-close" id="btn-fechar-sucesso">×</button>

      <h2>Solicitação enviada</h2>

      <p id="mensagem-sucesso">
        Solicitação enviada para aprovação.
      </p>

      <div class="modal-actions">
        <button type="button" class="btn-confirmar" id="btn-ir-login">
          Ir para o login
        </button>
      </div>

    </div>
  </div>

  <script>
  const API = `http://${window.location.hostname || "localhost"}:5227/api`;

  // ─── Card de sucesso ────────────────────────────────────────────────────────
  const modalSucesso = document.getElementById("modal-sucesso");

  function irParaLogin() {
    window.location.href = "login.html";
  }

  function mostrarSucesso(mensagem) {
    document.getElementById("mensagem-sucesso").textContent =
      mensagem || "Solicitação enviada para aprovação.";

    modalSucesso.style.display = "flex";
    document.getElementById("btn-ir-login").focus();
  }

  // Qualquer jeito de fechar leva para o login
  document.getElementById("btn-ir-login").addEventListener("click", irParaLogin);
  document.getElementById("btn-fechar-sucesso").addEventListener("click", irParaLogin);

  modalSucesso.addEventListener("click", (e) => {
    if (e.target === modalSucesso) irParaLogin();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modalSucesso.style.display === "flex") {
      irParaLogin();
    }
  });

  // ─── Cadastro ───────────────────────────────────────────────────────────────
  async function register() {
    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    const erro = document.getElementById("erro");
    const btn = document.querySelector(".btn-login");

    erro.style.display = "none";

    if (!nome || !email || !senha) {
      erro.textContent = "Preencha todos os campos.";
      erro.style.display = "block";
      return;
    }

    if (senha !== confirm) {
      erro.textContent = "As senhas não coincidem.";
      erro.style.display = "block";
      return;
    }

    btn.disabled = true; // evita duplo clique

    try {
      const res = await fetch(`${API}/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ nome, email, senha })
      });

      if (res.ok) {
        const data = await res.json().catch(() => ({}));
        mostrarSucesso(data.mensagem);
        return;
      }

      const data = await res.json().catch(() => null);
      erro.textContent = data?.[0]?.description || "Erro ao criar conta.";
      erro.style.display = "block";
    } catch {
      erro.textContent = "Falha de conexão com o servidor.";
      erro.style.display = "block";
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
